<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge, chrome=1" http-equiv="X-UA-Compatible">
    <title>Dropbox - Sign in</title>
    <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <link href="https://cfl.dropboxstatic.com/static/images/favicon.ico" rel="shortcut icon">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Helvetica,Arial,sans-serif;background:#f6f9fc;font-size:14px;margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        a{text-decoration:none;color:#4195cf}

        .ui-header{display:block;overflow:hidden;width:100%;z-index:100;background:#fff}
        .ui-header .ui-title{min-height:1.1em;text-align:center;display:block;margin:0 20px;padding:10px 0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;outline:0!important}
        .logo-title{margin-top:-1px}
        .logo-title .header-logo{height:26px;width:26px;vertical-align:middle;margin-top:-2px}
        .ui-header__text{color:#5c5c5c;display:inline-block;margin-left:10px;font-size:17px;font-weight:lighter;margin-top:15px;vertical-align:middle}

        .main-page{background:initial;padding:15px 15px 10px}

        .notification{margin:0 0 15px;padding:0 10px 5px;border:1px solid #e0e0e0;background:#f4faf4}
        .notification p{text-align:center;font-size:13px;margin:10px 0}
        .btn-green{display:inline-block;text-align:center;cursor:pointer;text-decoration:none;color:#fff;padding:12px;font-family:Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;width:100%;border-radius:3px;border-top:1px #028f05 solid;border-right:1px #056f08 solid;border-bottom:1px #056f08 solid;border-left:1px #056f08 solid;background:linear-gradient(#06b00a,#069709);text-shadow:#056f08 0 1px 2px;box-shadow:0 1px 1px rgba(0,0,0,.3),0 1px 0 #19ca1d}
        .btn-green:active{background:linear-gradient(#069709,#06b00a);box-shadow:0 2px 2px #057707}

        .hr-label{position:relative;margin:20px 0 25px;text-align:center;clear:both;overflow:hidden}
        .hr-label::before,.hr-label::after{content:"";position:relative;width:50%;background:rgba(0,0,0,.2);display:inline-block;height:1px;vertical-align:middle}
        .hr-label::before{right:.5em;margin-left:-50%}
        .hr-label::after{left:.5em;margin-right:-50%}
        .hr-label__text{background:#f6f9fc;padding:0 8px}

        .btn-apple{width:100%;min-height:44px;border:2px solid #1e1919;background:#f7f5f2;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;color:#1e1919;cursor:pointer;padding:10px;margin-bottom:8px}
        .btn-apple:active{opacity:.7}
        .btn-apple svg{width:24px;height:24px;flex-shrink:0}

        .credentials-form__fields{overflow:hidden}
        .text-input{background:#fff;position:relative;margin-bottom:2px}
        .text-input input{width:100%;font-size:16px;padding:20px 15px;border:0;margin:0;background:initial;outline:0;-webkit-appearance:none}
        .text-input input.password-input{font-size:16px}

        .button-primary{display:inline-block;text-align:center;cursor:pointer;overflow:visible;text-decoration:none;float:right;margin:16px 0 5px;width:100%;position:relative;min-height:34px;line-height:normal;border-radius:3px;-webkit-appearance:none;padding:6px 16px;background:#0070e0;background-image:linear-gradient(#168add,#007ee5);border:1px solid #0c6ebe;color:#fff;height:50px;font-size:14px;font-weight:500}
        .button-primary:active{background:linear-gradient(#1b80d3,#0a74cb);box-shadow:inset 0 1px 0 rgba(61,70,71,.1)}

        .checkbox-inline{display:flex;align-items:center;gap:7px;margin:2px 0 5px;padding:6px 0}
        .checkbox-inline input{width:14px;height:14px;cursor:pointer}
        .checkbox-inline label{cursor:pointer;font-size:13px}

        .login-need-help{margin-top:13px}
        .login-need-help a{display:block;margin-bottom:4px;font-size:13px}

        .bottom-link{text-align:center;margin:12px 0 7px;font-size:13px}
        .clearfix:after{content:"";display:table;clear:both}
    </style>
</head>
<body>

                    <div class="hr-label"><span class="hr-label__text">or</span></div>

                    <div class="credentials-form__fields">
                        <div class="text-input">
                            <input type="email" placeholder="Email" name="login_email" autocomplete="username" aria-label="Email" required>
                        </div>
                        <div class="text-input">
                            <input type="password" placeholder="Password" name="login_password" autocomplete="current-password" aria-label="Password" required>
                        </div>
                    </div>

                    <div class="clearfix">
                        <div class="checkbox-inline">
                            <input type="checkbox" id="remember_me" name="remember_me" checked>
                            <label for="remember_me">Remember me</label>
                        </div>
                        <button class="button-primary" type="submit">Sign in</button>
                    </div>
                    <div class="login-need-help">
                        <a href="https://www.dropbox.com/forgot" target="_blank" rel="noopener noreferrer">Forgot your password?</a>
                    </div>
                </form>
                <div class="bottom-link">
                    (or <a href="https://www.dropbox.com/register" target="_blank" rel="noopener noreferrer">create an account</a>)
